name: contracts

permissions:
  contents: read

on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'

jobs:
  foundry:
    name: Foundry fuzz + invariant tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace (for OZ remapping)
        run: pnpm install --frozen-lockfile

      - name: Run Foundry fuzz + invariant tests
        working-directory: contracts
        run: forge test --match-path "test/foundry/*" -v

  slither:
    name: Slither static analysis (v2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Slither shells out to `forge config` / `forge build`, so this single
      # setup step must leave forge on PATH. Version is checked before analysis.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: pnpm --filter @oversync/contracts compile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install slither
        run: pip install --require-hashes -r .github/pip/slither-requirements.txt

      - name: Verify Foundry
        run: forge --version

      - name: Run slither on v2 contracts
        working-directory: contracts
        run: |
          slither contracts/v2 --filter-paths "node_modules|test" --exclude naming-convention,solc-version,timestamp --json slither-results.json

      - name: Upload Slither report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: contracts/slither-results.json
