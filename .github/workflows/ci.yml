name: ci
# PR comparison marker – no functional impact

on:
  push:
    branches: [master, main, v2-rebuild]
  pull_request:
    branches: [master, main, v2-rebuild]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check relayer Docker build context
        run: node --test relayer/test/dockerignore.test.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test repository scripts
        run: pnpm test:scripts

      # Guards #384: every evidence/Slither artifact upload must declare a
      # bounded retention-days, including upload steps added later.
      - name: Check CI artifact retention
        run: node scripts/check-artifact-retention.mjs

      # Guards #355: each env key must appear exactly once in env.example, so
      # operators cannot edit one copy while deployment reads another.
      - name: Check env.example for duplicate keys
        run: node --test scripts/lib/env-keys.test.mjs

      - name: Validate deployment JSON
        run: pnpm validate:deployments
      - name: Check environment variable documentation
        run: pnpm check:env-docs

      - name: Build SDK
        run: pnpm --filter @oversync/sdk build

      - name: Typecheck — SDK
        run: pnpm --filter @oversync/sdk exec tsc --noEmit

      - name: Typecheck — coordinator
        run: pnpm --filter @oversync/coordinator exec tsc --noEmit

      - name: Typecheck — resolver
        run: pnpm --filter @oversync/resolver exec tsc --noEmit

      - name: Typecheck — frontend
        run: pnpm --filter @oversync/frontend exec tsc --noEmit

      - name: Typecheck — relayer
        run: pnpm --filter @oversync/relayer exec tsc --noEmit

      - name: Lint — relayer
        run: pnpm --filter @oversync/relayer lint

      - name: Test — SDK
        run: pnpm --filter @oversync/sdk test

      - name: Test — frontend
        run: pnpm --filter @oversync/frontend test

      - name: Test — coordinator
        run: pnpm --filter @oversync/coordinator test

      - name: Test — resolver
        run: pnpm --filter @oversync/resolver test

      - name: Test — cross-chain authorization parity
        run: pnpm --filter @oversync/e2e test

      - name: Compile contracts
        run: pnpm --filter @oversync/contracts compile

      - name: Test — contracts (Hardhat)
        run: pnpm --filter @oversync/contracts exec hardhat test test/v2/HTLCEscrow.test.ts test/v2/ResolverRegistry.test.ts

      - name: Check evidence links
        run: node scripts/check-evidence-links.mjs

      - name: Generate CI evidence summary
        env:
          JOB_STATUS: ${{ job.status }}
        run: node scripts/generate-ci-evidence.mjs

      - name: Upload CI evidence summary
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-summary-typescript
          path: evidence-summary.md
          retention-days: 14

  soroban:
    name: Soroban contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: soroban
    steps:
      - uses: actions/checkout@v4

      # Pinned deliberately. `@stable` resolves to a toolchain that rejects
      # ethnum 1.5.0 (pinned by stellar-cli 22.8.1's own lockfile, which we keep
      # via --locked): rustc nightly-2026-04-18 grew `TryFromIntError` from 0 to
      # 1 byte, so ethnum's `transmute(())` fails with E0512.
      #
      # The floor is 1.88: the highest rust-version of any crate in the committed
      # soroban/Cargo.lock (darling, serde_with and time need it), and --locked
      # cannot fall back to older versions. It is also past 1.84, the first
      # release with the `wasm32v1-none` target that `stellar contract build`
      # requires. Staying below ~1.97 keeps the `TryFromIntError` layout ethnum
      # expects. Raise the floor if a lockfile update raises that maximum.
      #
      # To move off this pin: upgrade stellar-cli past 22.8.1 to a release whose
      # lockfile uses ethnum >= 1.5.3, then return to `@stable`.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            soroban/target
          key: soroban-${{ runner.os }}-${{ hashFiles('soroban/Cargo.toml', 'soroban/Cargo.lock', 'soroban/contracts/**/Cargo.toml') }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # One pinned install. stellar-cli 22.8.1 depends on ethnum 1.5.0, which no
      # longer compiles under current stable Rust, so this uses the released
      # binary via cargo-binstall rather than a second `cargo install`.
      - name: Install Stellar CLI
        run: |
          cargo binstall -y stellar-cli --version 22.8.1
          stellar --version

      # soroban/Cargo.lock is committed and is the only source of the resolved
      # graph: nothing in this job may re-resolve it. In particular it pins
      # ed25519-dalek to 2.2.0. soroban-env-host 22.1.3 declares ed25519-dalek as
      # an open `>=2.0.0` range, which a fresh resolve takes to 3.x, and that
      # release's rand_core 0.9 traits are incompatible with the rand_chacha 0.3
      # ChaCha20Rng the crate's testutils pass to SigningKey::generate, so the
      # test build fails.
      #
      # `stellar contract build` has no --locked flag, so this step comes first:
      # it fails if Cargo.lock no longer matches the manifests, instead of the
      # build quietly rewriting it. To change dependencies, run `cargo update`
      # locally and commit the new soroban/Cargo.lock.
      - name: Check Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build WASM
        run: stellar contract build

      - name: Run unit tests
        run: cargo test --release --locked

      - name: Generate CI evidence summary (Soroban)
        env:
          JOB_STATUS: ${{ job.status }}
        run: node ${{ github.workspace }}/scripts/generate-ci-evidence.mjs

      - name: Upload CI evidence summary (Soroban)
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-summary-soroban
          path: evidence-summary.md
          retention-days: 14
