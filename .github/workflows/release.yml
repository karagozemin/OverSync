name: release

on:
  push:
    tags:
      - 'v*'

# Pushes of the same tag share one concurrency group. github.ref_name is the
# tag (for example v1.2.3) on this workflow, which only runs for v* tags.
# A newer run for that tag cancels the in-progress build so two resolver
# image publications cannot race on ghcr.io. Different tags still publish
# in parallel because each tag has its own group.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resolver-docker:
    name: Build + push resolver Docker image
    runs-on: ubuntu-latest
    environment: release
    # Multi-arch image builds finish well under this. A hung buildx step cannot hold the runner indefinitely.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/oversync-resolver
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build + push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./resolver
          file: ./resolver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
