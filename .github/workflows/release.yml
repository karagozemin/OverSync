name: release

on:
  push:
    tags:
      - 'v*'

# Pushes of the same tag share one concurrency group. github.ref_name is the
# tag (for example v1.2.3) on this workflow, which only runs for v* tags.
# A newer run for that tag cancels the in-progress build so two resolver
# image publications cannot race on ghcr.io. Different tags still publish
# in parallel because each tag has its own group.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resolver-docker:
    name: Build + push resolver Docker image
    runs-on: ubuntu-latest
    # Multi-arch image builds finish well under this. A hung buildx step cannot hold the runner indefinitely.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oversync-resolver
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ./resolver
          file: ./resolver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
