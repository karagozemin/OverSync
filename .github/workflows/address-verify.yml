name: address-verify

permissions:
  contents: read

on:
  push:
    paths:
      - 'README.md'
      - 'ROADMAP.md'
      - 'deployments.testnet.json'
      - 'deployments.mainnet.json'
      - 'env.example'
      - 'docs/DEPLOYMENT.md'
      - 'frontend/src/config/**'
      - 'frontend/src/lib/sdk-context.ts'
      - 'resolver/src/config.ts'
      - 'coordinator/src/config.ts'
      - 'scripts/verify-addresses.mjs'
      - '.github/workflows/address-verify.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'ROADMAP.md'
      - 'deployments.testnet.json'
      - 'deployments.mainnet.json'
      - 'env.example'
      - 'docs/DEPLOYMENT.md'
      - 'frontend/src/config/**'
      - 'frontend/src/lib/sdk-context.ts'
      - 'resolver/src/config.ts'
      - 'coordinator/src/config.ts'
      - 'scripts/verify-addresses.mjs'
      - '.github/workflows/address-verify.yml'

jobs:
  verify:
    name: Docs/config address consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify addresses
        run: node scripts/verify-addresses.mjs
