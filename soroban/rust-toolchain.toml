# Pin the Rust toolchain to 1.81.0 — the stable version at the time
# soroban-sdk 22.0.x / soroban-env-host 22.1.3 were published.
#
# soroban-env-host 22.1.3 uses ed25519-dalek 3.0.0 + rand_core 0.10.1.
# In Rust >= 1.82 the rand_core 0.10 CryptoRng trait bound changed in a way
# that breaks the `generate<R: CryptoRng + ?Sized>` signature inside
# soroban-env-host, causing E0277. Pinning to 1.81.0 avoids this until
# upstream publishes a soroban-sdk 22.x that resolves the conflict cleanly.
[toolchain]
channel = "1.81.0"
targets = ["wasm32-unknown-unknown"]
